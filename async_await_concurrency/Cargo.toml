[workspace]
resolver = "3"
members = [
  "async_channels",
  "blocking",
  "file_io_asyn",
  "handling_errors",
  "hello_async",
  "hello_tokio",
  "rest_client", "sharing_state",
  "testing_tokio", "tokio_db", "tokio_select", "tokio_tracing",
]

[workspace.dependencies]
tokio = { version = "1.53.2", features = ["full"] }
anyhow = "1.0.104"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
